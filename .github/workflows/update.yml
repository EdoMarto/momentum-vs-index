name: Update paper portfolio

on:
  schedule:
    # Weekdays at 23:12 UTC, after the US market close, so the day's closing prices are available.
    - cron: "12 23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh the S&P 500 members
        run: python -m paper_trader.refresh_universe

      - name: Run the daily update
        run: python -m paper_trader.run

      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ docs/data.json universe.txt paper_trader/names.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update portfolio data ($(date -u +%Y-%m-%d))"
            git push
          fi
